services:
  mongo:
    image: mongo:8.0
    container_name: anando-deal-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - anando-deal-mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  anando-deal-mongo-data:
