services:
  mongo:
    image: mongo:8.0
    container_name: yaqeen-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - yaqeen-mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  yaqeen-mongo-data:
